name: 🚀 CI/CD Pipeline

on:
  push:
    branches: [master]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ──────────────────────────────
  # Job 1 : Build + Tests
  # ──────────────────────────────
  build-check:
    name: 🔨 Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🔍 Audit dependencies
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: 🧪 Run tests
        run: npm test

  # ──────────────────────────────
  # Job 2 : Build image Docker + Push GHCR
  # ──────────────────────────────
  build-image:
    name: 🐳 Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: build-check
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: 🔧 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔑 Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🏷️ Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-

      - name: 🐳 Build & Push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            GIT_SHA=${{ github.sha }}

  # ──────────────────────────────
  # Job 3 : Deploy sur VPS
  # ──────────────────────────────
  deploy:
    name: 🌐 Deploy to VPS
    runs-on: ubuntu-latest
    needs: build-image
    environment:
      name: production
      url: https://ocoffee.creachtheo.fr
    steps:
      - uses: actions/checkout@v4

      - name: 🏷️ Set image tag
        id: set-tag
        run: echo "IMAGE_TAG=sha-$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_OUTPUT

      - name: 📤 Copy docker-compose.prod.yml to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          source: docker-compose.prod.yml
          target: /root/projects/O-Coffee

      - name: 🚀 Deploy via SSH
        uses: appleboy/ssh-action@v1
        env:
          IMAGE_TAG: ${{ steps.set-tag.outputs.IMAGE_TAG }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          envs: IMAGE_TAG
          script: |
            cd /root/projects/O-Coffee
            echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            echo "📦 Deploying image tag: $IMAGE_TAG"
            export IMAGE_TAG
            # GHCR exige un nom d'image en minuscules (le repo est O-Coffee)
            export GHCR_IMAGE=$(echo "ghcr.io/${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
            docker compose -p o-coffee -f docker-compose.prod.yml pull
            docker compose -p o-coffee -f docker-compose.prod.yml up -d --force-recreate --remove-orphans
            docker image prune -f
            echo "✅ Deployed to https://ocoffee.creachtheo.fr"
