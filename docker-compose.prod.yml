services:
  db:
    image: postgres:14-alpine
    container_name: o-coffee-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PG_USER}
      POSTGRES_PASSWORD: ${PG_PASSWORD}
      POSTGRES_DB: ${PG_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - traefik-public

  ocoffee:
    image: ${GHCR_IMAGE}:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      - db
    # Variables runtime (PORT, SECRET, PG_USER, PG_PASSWORD, PG_DB, PG_HOST)
    # lues depuis le fichier .env present sur le VPS dans ce dossier.
    env_file: .env
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.ocoffee.rule=Host(`ocoffee.creachtheo.fr`)"
      - "traefik.http.routers.ocoffee.entrypoints=websecure"
      - "traefik.http.routers.ocoffee.tls.certresolver=myresolver"
      - "traefik.http.services.ocoffee.loadbalancer.server.port=${PORT}"
    networks:
      - traefik-public

networks:
  traefik-public:
    external: true

volumes:
  postgres-data:
    name: o-coffee_postgres-data
    external: true
